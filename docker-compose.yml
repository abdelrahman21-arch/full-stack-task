services:
  postgres:
    image: postgres:18
    container_name: referral-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: referrals
    ports:
      - "5432:5432"
    volumes:
      - referral-postgres-data:/var/lib/postgresql

volumes:
  referral-postgres-data:
